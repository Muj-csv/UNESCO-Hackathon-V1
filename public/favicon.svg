  <rect x="4" y="6" width="16" height="9" rx="1" fill="#fed01b" stroke="#191b23" stroke-width="2"/>
  <rect x="11" y="18" width="16" height="9" rx="1" fill="#faf8ff" stroke="#191b23" stroke-width="2" stroke-dasharray="4 3"/>
</svg>
